server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  types { application/javascript mjs; }

  location = /healthz { access_log off; return 200 "ok\n"; }

  # HTML and data revalidate every time so updates show immediately
  location ~* \.(html|json)$ { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  # Code and styles are versioned with ?v=N
  location ~* \.(js|mjs|css)$ { add_header Cache-Control "public, max-age=86400" always; add_header X-Content-Type-Options nosniff always; }

  location / { try_files $uri $uri/ /index.html; }
}
