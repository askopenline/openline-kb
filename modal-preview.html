<!doctype html>
<html lang="en" data-embed="1">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<title>Openline · KB modal preview</title>
<meta name="robots" content="noindex, follow" />
<link rel="canonical" href="https://kb.openline.com/" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<link rel="stylesheet" href="/style.css?v=28" />
<style>
  /* Stage-only styles (fake openline.com landing behind the modal) */
  body { background: #FFF7EE !important; overflow: hidden; }
  .stage-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    background: #FFFFFF;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .stage-topbar .stage-brand { display: inline-flex; align-items: center; gap: 10px; color: #0F1114; text-decoration: none; }
  .stage-topbar .brand-word { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .stage-topbar nav { display: flex; gap: 6px; align-items: center; }
  .stage-topbar nav a {
    color: #0F1114; text-decoration: none;
    font-weight: 500; font-size: 14px;
    padding: 8px 14px; border-radius: 999px;
  }
  .stage-topbar nav a:hover { background: #F5F5F7; }
  .stage-hero {
    max-width: 1180px; margin: 0 auto; padding: 80px 40px 40px;
  }
  .stage-eyebrow {
    text-transform: uppercase; letter-spacing: .1em;
    font-size: 12.5px; color: #E85E00; font-weight: 700;
    margin: 0 0 12px;
  }
  .stage-hero h1 {
    font-size: 56px; font-weight: 900; letter-spacing: -0.035em;
    margin: 0 0 24px; line-height: 1;
    color: #0F1114;
  }
  .stage-hero h1 .accent { color: #FF6A00; }
  .stage-hero p { color: #3A3F47; font-size: 18px; max-width: 620px; margin: 0; }
  .stage-cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    background: #0F1114; color: #fff;
    border: 0; border-radius: 999px;
    font-family: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
    margin-top: 28px;
    box-shadow: 0 8px 24px rgba(15, 17, 20, .12);
    transition: background .12s;
    text-decoration: none;
  }
  .stage-cta:hover { background: #FF6A00; color: #fff; }

  /* Full-screen modal wrapping the KB app */
  .modal-shell {
    position: fixed; inset: 0;
    background: rgba(15, 17, 20, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex; align-items: stretch; justify-content: stretch;
  }
  .modal-card {
    background: #FFFFFF;
    width: 100%; height: 100%;
    overflow: auto;
    display: block;
    position: relative;
  }
  @media (min-width: 720px) {
    .modal-shell { padding: 24px; }
    .modal-card {
      max-width: 1280px; max-height: 100%;
      margin: auto;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(15, 17, 20, .35);
    }
  }
  @media (min-width: 1024px) {
    .modal-shell { padding: 40px; }
    .modal-card { border-radius: 20px; }
  }
  .modal-close-btn {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(15, 17, 20, .08);
    background: #FFFFFF;
    color: #3A3F47;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(15, 17, 20, .08);
    transition: color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    text-decoration: none;
  }
  .modal-close-btn svg { transition: transform .2s ease; display: block; }
  .modal-close-btn:hover {
    color: #0F1114;
    border-color: rgba(15, 17, 20, .18);
    box-shadow: 0 4px 12px rgba(15, 17, 20, .12);
  }
  .modal-close-btn:hover svg { transform: rotate(90deg); }

  /* Inline KB inside the modal card */
  .modal-card > .kb-inner {
    min-height: 100%;
    background: #FFFFFF;
  }
  /* Keep the KB topbar sticky within the modal, and let the KB footer render
     inside the modal card. */
  .modal-card .topbar { position: static; background: transparent; padding-right: 64px; }
  .modal-card .skip-link { display: none; }
  /* Contain the footer to the modal card's content width */
  .modal-card .footer { padding-bottom: 32px; }
  .modal-card .hero { padding-top: 32px; }
  .modal-card main { padding-bottom: 40px; }

  @media (max-width: 900px) {
    .stage-topbar { padding: 14px 18px; }
    .stage-topbar nav { display: none; }
    .stage-hero { padding: 40px 18px; }
    .stage-hero h1 { font-size: 40px; }
  }
</style>
</head>
<body>
  <!-- Fake Openline.com landing behind the modal -->
  <div class="stage-topbar" aria-hidden="true">
    <a class="stage-brand" href="/">
      <img src="https://raw.githubusercontent.com/askopenline/openline-brand-assets/main/logo/png/openline-logo-color.png" alt="" width="28" height="28" />
      <span class="brand-word">Openline</span>
    </a>
    <nav>
      <a href="#">Destinations</a>
      <a href="#">Features</a>
      <a href="#">Pro</a>
      <a href="#">Support</a>
    </nav>
  </div>
  <section class="stage-hero" aria-hidden="true">
    <p class="stage-eyebrow">Openline.com · Preview</p>
    <h1>eSIMs That Always Get the <span class="accent">Best Signal</span></h1>
    <p>Instant data in 190+ countries. Multi-carrier Tier-1 networks. No roaming bills, no physical SIM cards.</p>
    <a class="stage-cta" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Open standalone knowledge base
    </a>
  </section>

  <!-- Full-screen modal hosting the KB app inline (no iframe, because the KB host sends X-Frame-Options: DENY) -->
  <div class="modal-shell" role="dialog" aria-modal="true" aria-label="Openline knowledge base">
    <div class="modal-card">
      <a class="modal-close-btn" href="/" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </a>

      <div class="kb-inner">
        <!-- KB -->

      </div>
    </div>
  </div>

  <!-- KB-I18N -->
  <script type="module" src="/app.js?v=28"></script>
</body>
</html>
