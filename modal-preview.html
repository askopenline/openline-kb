<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Openline · KB modal preview</title>
<link rel="icon" href="https://raw.githubusercontent.com/paulfxyz/openline-brand-assets/main/openline-mark-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
<style>
  :root {
    --brand: #FF6A00;
    --brand-ink: #E85E00;
    --ink: #0F1114;
    --ink-2: #3A3F47;
    --paper: #FFF7EE;
    --paper-2: #F5F1EA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* Fake Openline.com stage behind the modal */
  .stage-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    background: #FFFFFF;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .stage-topbar .brand { display: inline-flex; align-items: center; gap: 10px; color: #0F1114; text-decoration: none; }
  .stage-topbar .brand-word { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .stage-topbar nav { display: flex; gap: 6px; align-items: center; }
  .stage-topbar nav a {
    color: #0F1114; text-decoration: none;
    font-weight: 500; font-size: 14px;
    padding: 8px 14px; border-radius: 999px;
  }
  .stage-topbar nav a:hover { background: #F5F5F7; }
  .stage-hero {
    max-width: 1180px; margin: 0 auto; padding: 80px 40px 40px;
  }
  .stage-eyebrow {
    text-transform: uppercase; letter-spacing: .1em;
    font-size: 12.5px; color: var(--brand-ink); font-weight: 700;
    margin: 0 0 12px;
  }
  .stage-hero h1 {
    font-size: 56px; font-weight: 900; letter-spacing: -0.035em;
    margin: 0 0 24px; line-height: 1;
    color: var(--ink);
  }
  .stage-hero h1 .accent { color: var(--brand); }
  .stage-hero p { color: var(--ink-2); font-size: 18px; max-width: 620px; margin: 0; }
  .stage-cta {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 24px;
    background: var(--ink); color: #fff;
    border: 0; border-radius: 999px;
    font-family: inherit; font-weight: 600; font-size: 15px;
    cursor: pointer;
    margin-top: 28px;
    box-shadow: 0 8px 24px rgba(15, 17, 20, .12);
    transition: background .12s;
    text-decoration: none;
  }
  .stage-cta:hover { background: var(--brand); color: #fff; }

  /* Full-screen modal that wraps the entire KB app in an iframe */
  .modal-shell {
    position: fixed; inset: 0;
    background: rgba(15, 17, 20, .55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex; align-items: stretch; justify-content: stretch;
  }
  .modal-card {
    background: #FFFFFF;
    width: 100%; height: 100%;
    overflow: hidden;
    display: block;
    position: relative;
  }
  @media (min-width: 900px) {
    .modal-shell { padding: 40px; }
    .modal-card {
      max-width: 1280px; max-height: 100%;
      margin: auto;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(15, 17, 20, .35);
    }
  }
  .kb-frame {
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #FFFFFF;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 40px; height: 40px;
    border-radius: 999px;
    border: 1px solid rgba(15, 17, 20, .08);
    background: #FFFFFF;
    color: #3A3F47;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(15, 17, 20, .08);
    transition: color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    text-decoration: none;
  }
  .modal-close svg { transition: transform .2s ease; display: block; }
  .modal-close:hover {
    color: var(--ink);
    border-color: rgba(15, 17, 20, .18);
    box-shadow: 0 4px 12px rgba(15, 17, 20, .12);
  }
  .modal-close:hover svg { transform: rotate(90deg); }
  .modal-close:active { transform: scale(.94); }

  @media (max-width: 900px) {
    .stage-topbar { padding: 14px 18px; }
    .stage-topbar nav { display: none; }
    .stage-hero { padding: 40px 18px; }
    .stage-hero h1 { font-size: 40px; }
  }
</style>
</head>
<body>
  <!-- Fake Openline.com landing behind the modal -->
  <div class="stage-topbar" aria-hidden="true">
    <a class="brand" href="/">
      <img src="https://raw.githubusercontent.com/paulfxyz/openline-brand-assets/main/logo/png/openline-logo-color.png" alt="" width="28" height="28" />
      <span class="brand-word">Openline</span>
    </a>
    <nav>
      <a href="#">Destinations</a>
      <a href="#">Features</a>
      <a href="#">Pro</a>
      <a href="#">Support</a>
    </nav>
  </div>
  <section class="stage-hero" aria-hidden="true">
    <p class="stage-eyebrow">Openline.com · Preview</p>
    <h1>eSIMs That Always Get the <span class="accent">Best Signal</span></h1>
    <p>Instant data in 190+ countries. Multi-carrier Tier-1 networks. No roaming bills, no physical SIM cards.</p>
    <a class="stage-cta" href="./index.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Open standalone knowledge base
    </a>
  </section>

  <!-- Full-screen modal wrapping the entire KB inside an iframe -->
  <div class="modal-shell" role="dialog" aria-modal="true" aria-labelledby="kb-title">
    <div class="modal-card">
      <a class="modal-close" href="./index.html" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </a>
      <iframe
        id="kb-title"
        class="kb-frame"
        src="./index.html?embed=1"
        title="Openline knowledge base"
        loading="eager"
        allow="clipboard-write"
      ></iframe>
    </div>
  </div>
</body>
</html>
